[package]
name = "herdr-newtab-plus"
version = "0.2.1"
edition = "2021"
rust-version = "1.88"
description = "New tab for Herdr with a folder picker that completes real paths, and an optional agent to start"
license = "MIT"
publish = false

[[bin]]
name = "herdr-newtab-plus"
path = "src/main.rs"

[features]
# Only for the README demo recorder (examples/record_demo); never in the binary.
demo = ["dep:ab_glyph"]

[[example]]
name = "record_demo"
path = "examples/record_demo/main.rs"
required-features = ["demo"]

[dependencies]
ab_glyph = { version = "0.2", optional = true }
libc = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
