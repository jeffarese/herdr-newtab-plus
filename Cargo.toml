[package]
name = "herdr-newtab-plus"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
description = "New tab for Herdr with a folder picker that completes real paths, and an optional agent to start"
license = "MIT"
publish = false

[[bin]]
name = "herdr-newtab-plus"
path = "src/main.rs"

[dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
