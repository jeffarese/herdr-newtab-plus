id = "herdr-newtab-plus"
name = "New Tab Plus"
version = "0.2.1"
# 0.7.4 is the first release with session-modal popup plugin panes. The picker
# also needs `session.snapshot` (0.7.2) to infer which folders already have a
# space open.
min_herdr_version = "0.7.4"
description = "New tab with a folder picker that completes real paths, and an optional agent to start"
platforms = ["linux", "macos"]

# The picker is a Rust binary at bin/herdr-newtab-plus. On install (updating is
# reinstalling), Herdr runs this step in the plugin directory: it downloads the
# release binary for this version and platform, checks it against the
# release's SHA256SUMS and the version it reports, and falls back to
# `cargo build --release` (Rust 1.88+). `herdr plugin link` never runs it, so a
# linked checkout runs `sh scripts/install.sh` itself.
[[build]]
command = ["sh", "scripts/install.sh"]

# Opening the picker is a one-liner through the Herdr CLI, so the action stays a
# shell exec. HERDR_BIN_PATH can outlive the binary it points at when Herdr is
# upgraded under a running server, so fall back to whatever is on PATH.
[[actions]]
id = "open"
title = "New tab"
description = "Pick a folder and an optional agent, then open a tab there"
contexts = ["global"]
command = [
  "sh",
  "-c",
  'herdr_bin="${HERDR_BIN_PATH:-herdr}"; [ -x "$herdr_bin" ] || herdr_bin=herdr; exec "$herdr_bin" plugin pane open --plugin herdr-newtab-plus --entrypoint newtab --placement popup',
]

[[panes]]
id = "newtab"
title = "New tab"
description = "Pick a folder and an optional agent, then open a tab there"
placement = "popup"
# Cells rather than percentages, because the useful size of this popup does not
# scale with the monitor: the rows are a fixed width -- names cap at 34 columns
# over a short parent path -- so a percentage only ever bought empty columns.
#
# The size is set by the help panel rather than by the picker. The picker wants
# a short list and gets one whatever the popup is, capped at ten suggestions;
# the panel is a page of prose about what the keys and the create modes do, and
# a page it has to be read in halves is a page nobody reads. Herdr gives the pty
# `height - 2` rows and `width - 3` columns, so this is 28 rows for the panel,
# and for the picker ten folders with air above its chrome.
width = 110
height = 30
# Herdr resolves a command path with a separator from the plugin directory.
command = ["bin/herdr-newtab-plus"]
